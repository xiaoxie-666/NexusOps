name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q app scripts tests
      - name: Check release hygiene
        run: python scripts/check_release.py
      - name: Run tests
        env:
          APP_ENV: development
          AI_PROVIDER: mock
          DATABASE_URL: sqlite:///./target/ci-test.sqlite3
          REDIS_URL: redis://127.0.0.1:6379/15
          KNOWLEDGE_VECTOR_ENABLED: "false"
          BOOTSTRAP_ADMIN_PASSWORD: admin123
          BOOTSTRAP_ENGINEER_PASSWORD: engineer123
          BOOTSTRAP_ONCALL_PASSWORD: oncall123
        run: |
          mkdir -p target
          python -m pytest -q tests
